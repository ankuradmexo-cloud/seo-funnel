# Render blueprint: the FastAPI dashboard API only.
#
# The Next.js dashboard is NOT here - it deploys to Vercel and talks to the
# API service below over HTTPS. The pipeline is NOT here either: Render's
# free tier has no cron jobs, so the schedule lives in
# .github/workflows/pipeline.yml. Keep that file's env block in sync with
# any tuning changes.
#
# plan: free means the service spins down when idle - expect a ~50s cold
# start on the dashboard's first request after a quiet period.
#
# Secrets are intentionally sync:false - Render prompts for them on first
# deploy rather than storing them in this file. The Supabase key is the
# service_role key, which must never reach the browser; that is the whole
# reason the dashboard talks to this API instead of Supabase directly.
services:
  - type: web
    name: keyword-funnel-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Comma-separated. Must include the real Vercel domain once known -
      # CORS is load-bearing here, since the dashboard is on another origin.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SCRAPPA_API_KEY
        sync: false
      - key: SERANKING_API_KEY
        sync: false
