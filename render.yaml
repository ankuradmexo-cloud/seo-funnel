# Render blueprint: the FastAPI dashboard API plus the scheduled pipeline.
# The Next.js dashboard is NOT here - it deploys to Vercel and talks to the
# API service below over HTTPS.
#
# Secrets are intentionally sync:false - Render prompts for them on first
# deploy rather than storing them in this file. The Supabase key is the
# service_role key, which must never reach the browser; that is the whole
# reason the dashboard talks to this API instead of Supabase directly.
services:
  - type: web
    name: keyword-funnel-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Comma-separated. Must include the real Vercel domain once known -
      # CORS is load-bearing here, since the dashboard is on another origin.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SCRAPPA_API_KEY
        sync: false
      - key: SERANKING_API_KEY
        sync: false

  - type: cron
    name: keyword-funnel-pipeline
    runtime: python
    plan: starter
    # A run takes 15-40 minutes, which is why this is a Render cron job and
    # not a Vercel function - serverless timeouts are far shorter than that.
    # Twice daily gives each website two shots at its 2-keyword target while
    # rotating through niches.
    schedule: "0 6,18 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python run_pipeline.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SCRAPPA_API_KEY
        sync: false
      - key: SERANKING_API_KEY
        sync: false
      # Pipeline tuning - see src/config.py for what each one costs.
      - key: SEEDS_PER_NICHE
        value: "30"
      - key: QUESTIONS_LIMIT_PER_SEED
        value: "15"
      - key: RELATED_LIMIT_PER_SEED
        value: "0"
      - key: MAX_KEYWORDS_PER_SITE_PER_DAY
        value: "2"
      - key: MAX_DIFFICULTY_TO_JUDGE
        value: "40"
      - key: MAX_TOOL_CALLS_PER_RUN
        value: "100"
      - key: MAX_CANDIDATES_TO_JUDGE_PER_RUN
        value: "200"
