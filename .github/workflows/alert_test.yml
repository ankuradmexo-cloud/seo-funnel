# Manual-only: sends one test message to the internal alert tool so the
# INTERNAL_ALERT_TOKEN secret can be verified without running a pipeline.
name: alert-test
on:
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx
      - name: Send test alert
        env:
          INTERNAL_ALERT_TOKEN: ${{ secrets.INTERNAL_ALERT_TOKEN }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from src import alerts
          ok = alerts.send("Test alert", "Test message from the SEO funnel alerting setup - ignore.")
          sys.exit(0 if ok else 1)
          PY
