# The article pipeline's schedule - separate job from keyword-pipeline.yml
# so the two can be paused/rescheduled independently (they already have
# independent pause switches - see supabase/migration_wordpress_publishing.sql
# and article-pipeline/run_scheduler.py).
#
# Lives in GitHub Actions rather than Render for the same reason
# keyword-pipeline.yml does: Render's free tier has no cron jobs, and public
# repos get unlimited Actions minutes.
#
# Secrets come from repo Settings > Secrets and variables > Actions.
name: article-pipeline

on:
  schedule:
    # 08:00 UTC once daily - article generation is slower and more
    # expensive per call than keyword shortlisting, so one pass a day is
    # the default; articles_per_day per website controls the volume within it.
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: article-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: article-pipeline/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run article scheduler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SCRAPPA_API_KEY: ${{ secrets.SCRAPPA_API_KEY }}
          SERANKING_API_KEY: ${{ secrets.SERANKING_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          WP_PUBLISH_STATUS: "publish"
        run: python run_scheduler.py
